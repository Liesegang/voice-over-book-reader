[workspace]
members = ["crates/reader-core", "crates/reader-library", "crates/reader-speech", "crates/reader-app", "crates/reader-dictionary-popup", "crates/reader-voiceroid-bridge", "crates/reader-renderer-cef"]
exclude = ["crates/reader-renderer-cef/vendor/welding"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.3.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.reader-speech]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
