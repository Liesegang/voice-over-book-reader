[package]
name = "reader-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
cpal = "0.16"
directories = "6"
hound = "3.5"
libloading = "0.8"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "isomp4", "mp3", "pcm", "wav"] }
mp4ameta = "0.13"
id3 = "1.17"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["cuda", "load-dynamic", "ndarray"] }
base64 = "0.22"
jpreprocess = { version = "=0.15.0", features = ["naist-jdic"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[build-dependencies]
cc = "1"
