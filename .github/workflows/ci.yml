name: Native desktop CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_BUILD_JOBS: "2"

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Standard hosted labels checked against GitHub's runner reference:
      # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libvulkan1 \
            fonts-noto-cjk libnss3 libnspr4 libgbm1 libxss1 ninja-build clang libclang-dev cmake

      - name: Pin the macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"

      - name: Short native build directory
        # CEF generates very long C++ test/object names. Keep them out of the
        # checkout path so MSVC/CMake stay below the Windows MAX_PATH limit.
        # rust-cache joins its target input to the workspace: pass a relative
        # path there, while Cargo receives the matching absolute directory.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "vobr-target"
          target.mkdir(parents=True, exist_ok=True)
          relative = os.path.relpath(target, Path.cwd()).replace("\\", "/")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf8") as output:
              output.write(f"CARGO_TARGET_DIR={target.as_posix()}\n")
              output.write(f"VOBR_CACHE_TARGET_REL={relative}\n")
          print("Using short Cargo build output; package artifacts remain under target/packages")
          PY

      - name: Windows C++ toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Self-contained Windows CRT
        if: runner.os == 'Windows'
        # Every Cargo command has --target, so host proc macros remain unaffected.
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"

      - name: CEF build tools
        run: |
          if ! command -v ninja >/dev/null; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then brew install ninja; fi
            if [[ "$RUNNER_OS" == "Windows" ]]; then choco install ninja --yes --no-progress; fi
          fi
          cmake --version
          ninja --version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          fi

      - name: Pinned CEF SDK cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vobr-cef-sdk/${{ matrix.target }}
          key: cef154-${{ matrix.target }}-${{ hashFiles('scripts/cef-runtime-pins.json') }}

      - name: Prepare bundled CEF SDK
        run: python scripts/prepare-cef-sdk.py --target "${{ matrix.target }}" --directory "$RUNNER_TEMP/vobr-cef-sdk/${{ matrix.target }}" --github-env "$GITHUB_ENV"

      - name: Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.97.1 "${{ matrix.target }}"
          rustc +1.97.1 --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.target }}-release-1.97
          workspaces: . -> ${{ env.VOBR_CACHE_TARGET_REL }}
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo +1.97.1 fmt --all --check

      - name: Workspace build
        # Reuse the shipping profile for tests and packages. Building optimized
        # Japanese dictionaries in both dev and release doubles cold CI work.
        run: cargo +1.97.1 build --workspace --all-targets --release --locked --target "${{ matrix.target }}"

      - name: Offline-capable unit and fixture tests
        # The default tests never synthesize speech, download neural models,
        # open a GUI, or require an audio device. Native PDF/TTS smokes are ignored.
        run: cargo +1.97.1 test --workspace --all-targets --release --locked --target "${{ matrix.target }}"

      - name: Release binaries
        run: |
          cargo +1.97.1 build --workspace --release --bins --locked --target "${{ matrix.target }}"
          cargo +1.97.1 build -p voice-over-book-reader --lib --release --locked --target "${{ matrix.target }}"

      - name: Windows 32-bit native VOICEROID2 DLL host
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x86

      - name: Build and test the Windows 32-bit native VOICEROID2 DLL host
        if: runner.os == 'Windows'
        run: |
          rustup target add --toolchain 1.97.1 i686-pc-windows-msvc
          cargo +1.97.1 test -p reader-voiceroid-bridge --release --locked --target i686-pc-windows-msvc
          cargo +1.97.1 build -p reader-voiceroid-bridge --release --locked --target i686-pc-windows-msvc

      - name: Book navigator protocol tests
        # Pure Node tests; no browser, models, display or GPU is required.
        run: |
          node --version
          node crates/reader-renderer-cef/navigator.test.mjs

      - name: Packaging fixture tests
        run: |
          python scripts/ci-test-package.py
          python scripts/test-cef-bundle.py
          python scripts/test-cef-sdk.py

      - name: Windows installer boundary tests
        if: runner.os == 'Windows'
        run: python scripts/test-windows-installer.py

      - name: Package native processes and license notices
        run: python scripts/ci-package.py --target "${{ matrix.target }}" --output-dir target/packages

      - name: Verified Inno Setup 6.7.4 compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'vobr-inno-6.7.4'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          $download = Join-Path $toolRoot 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash -ne $expected) {
            throw 'Inno Setup download SHA-256 mismatch'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Pyrsys B\.V\.(,|$)') {
            throw 'Inno Setup download has an invalid or unexpected Authenticode signer'
          }
          $compilerDir = Join-Path $toolRoot 'compiler'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/TASKS=', ('/DIR="' + $compilerDir + '"'))
          $install = Start-Process -FilePath $download -ArgumentList $arguments -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Inno compiler setup failed: $($install.ExitCode)" }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $compiler
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Pyrsys B\.V\.(,|$)') {
            throw 'Installed Inno compiler has an invalid or unexpected Authenticode signer'
          }
          "ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Compile per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath target/packages -Filter '*-x86_64-pc-windows-msvc.zip' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one native Windows release ZIP' }
          python scripts/build-windows-installer.py --package $packages[0].FullName --iscc $env:ISCC --output-dir target/installers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-over-book-reader-${{ matrix.platform }}
          path: |
            target/packages/*.zip
            target/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-over-book-reader-windows-x64-installer
          path: |
            target/installers/*.exe
            target/installers/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
